note: >-
  Bynder's data model is asset-centred: Asset is the hub and almost every other
  entity either describes it (Metaproperty, Tag, Brand), contains it (Collection,
  Job, Order) or is produced from it (derivative, usage record, quarantine record).
  The model is split across generations of the API, and the split is load-bearing:
  the same conceptual Metaproperty is addressed by an 8-4-4-16 ColdFusion UUID on
  /api/v4 and by an RFC 4122 8-4-4-4-12 UUID on /api/1, and the two id spaces are
  not interchangeable.
