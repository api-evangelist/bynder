  example_shape: 00000000-0000-0000-0000000000000000
  source: https://api.bynder.com/docs/getting-started
- surface: /api/* (without /v4)
  format: RFC 4122 UUID version 4, 8-4-4-4-12
  example_shape: 00000000-0000-0000-0000-000000000000
  source: https://api.bynder.com/docs/getting-started
