versioning:
  scheme: uri-path
  note: >-
    Bynder does not run one version train. Each service carries its own path
    prefix and its own generation, and they coexist: /api/v4/ (the asset bank,
    ColdFusion-era UUIDs), /api/1/ (taxonomy, automations, derivative presets,
    content access — RFC 4122 v4 UUIDs), /v6/ (OAuth 2.0), /v7/ (upload, webhooks,
    quarantine/antivirus), /api/workflow/ (campaigns and jobs) and
    /api/store/ (Brandstore orders). There is no global version header and no
    documented version-negotiation mechanism.
  paths_observed:
  - /api/v4/
  - /api/1/
  - /v6/authentication/
  - /v7/
  - /api/workflow/
  - /api/store/
  docs: https://api.bynder.com/docs/getting-started
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  note: >-
    Bynder announces deprecations in the dated changelog but publishes no
    deprecation policy, no notice period, and no machine-readable signal. No
    operation in any of the 34 published OpenAPI definitions carries
    `deprecated: true`, and no RFC 8594 Sunset or Deprecation header is
    documented. An integrator learns an endpoint is going away only by reading
    the changelog prose. No `Deprecation` pointer is emitted for this profile —
    dated notices in a changelog are not a policy.
