note: >-
  Bynder publishes exactly one rate limit, applied per source IP address rather
  than per API key or per account, and documents no response headers for it.
  An agent cannot read its remaining budget from a Bynder response — it can only
  observe the 429 after the fact. Bynder's own guidance is to self-throttle to
  roughly 10 requests/second and, on a 429, to stop for five minutes.
limits:
- scope: per-ip
  window: 5m
  limit: 4500
  burst: null
  recommended_rate: 10 requests/second (Bynder's published guidance)
  status_on_exhaustion: 429
  reset_behavior: >-
    "If five minutes pass with no requests coming from your IP address we will
    lift the block and you will be able to send API requests again." Requests
    made during the block extend it — the window is idle-based, not rolling-reset.
  quote: >-
    "We allow a number of 4500 requests in any five-minute time frame from a
    single IP address. When you have reached the maximum number of allowed
    requests the exceeding requests will be blocked. When a request is rejected
    you will receive the 429 (Too Many Requests) error returned via the API."
  source: https://api.bynder.com/docs/getting-started
