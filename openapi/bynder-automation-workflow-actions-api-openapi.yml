openapi: 3.2.0
info:
  title: automation-workflow-svc Automation Workflow Actions API
  version: 1.0.0
  description: 'This API enables clients to manage automation-workflow rules.

    **Servers:**

    1. **Local Development:**

    - Base URL: `http://localhost:8080/{endpoint}`


    2. **Stage or Production:**

    - Base URL: `https://automation-workflow-service.bynder.com/api/1/automation-workflow/{endpoint}`


    Ensure you are using the appropriate server based on your environment (local or production).'
tags:
- name: Automation Workflow Actions
paths:
  /actions:
    get:
      tags:
      - Automation Workflow Actions
      summary: List Automation Workflow Actions
      description: Get a list of available automation workflow actions.
      operationId: getActions
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationWorkflowActionsResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthorizationResponse'
      security:
      - {}
      - httpAuth: []
components:
  schemas:
    AutomationWorkflowActionsResponse:
      title: AutomationWorkflowActionsResponse
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationWorkflowAction'
    ErrorAuthorizationResponse:
      title: ErrorAuthorizationResponse
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ErrorResponse:
      title: ErrorResponse
      type: object
      required:
      - message
      properties:
        message:
          type: string
    AutomationWorkflowAction:
      title: AutomationWorkflowAction
      type: object
      required:
      - action_type
      properties:
        action_type:
          type: string
  securitySchemes:
    httpAuth:
      type: http
      scheme: bearer
