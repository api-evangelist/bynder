openapi: 3.2.0
info:
  title: Bynder Automation Workflow Rules API
  version: 1.0.0
  description: 'Operations tagged Automation Workflow Rules across 2 of this provider''s published API definitions: bynder-automation-workflow-openapi.json, bynder-automation-workflow-svc-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://example.com/api/1/automation-workflow/
tags:
- name: Automation Workflow Rules
paths:
  /rules:
    get:
      tags:
      - Automation Workflow Rules
      summary: Fetches all automation workflow rules.
      description: Get all automation workflow rules by account id, with optional pagination (start and limit).
      operationId: getRules
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAutomationWorkflowRulesResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthorizationResponse'
      security:
      - {}
      - httpAuth: []
    post:
      tags:
      - Automation Workflow Rules
      summary: Create Automation Workflow Rule
      description: Create a new automation workflow rule.
      operationId: postRules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationWorkflowRuleBody'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAutomationWorkflowRuleResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthorizationResponse'
      security:
      - {}
      - httpAuth: []
  /rules/{ruleId}:
    get:
      tags:
      - Automation Workflow Rules
      summary: Fetches a automation workflow rule.
      description: Get a automation workflow rule by account id
      operationId: getRulesRuleid
      parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleRuleAutomationWorkflowResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthorizationResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
      security:
      - {}
      - httpAuth: []
    put:
      tags:
      - Automation Workflow Rules
      summary: Edit Automation Workflow Rule
      description: Edit an existing automation workflow rule.
      operationId: putRulesRuleid
      parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAutomationWorkflowRuleBody'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleRuleAutomationWorkflowResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthorizationResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
      security:
      - {}
      - httpAuth: []
    delete:
      tags:
      - Automation Workflow Rules
      summary: Remove Automation Workflow Rule
      description: Remove an automation workflow rule by its ID.
      operationId: deleteRulesRuleid
      parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthorizationResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
      security:
      - {}
      - httpAuth: []
  /rules/{ruleId}/status:
    patch:
      tags:
      - Automation Workflow Rules
      summary: Update Automation Workflow Rule Status
      description: Update the status of an existing automation workflow rule.
      operationId: patchRulesRuleidStatus
      parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusAutomationWorkflowRuleBody'
        required: true
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthorizationResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseRuleAlreadyPaused'
      security:
      - {}
      - httpAuth: []
