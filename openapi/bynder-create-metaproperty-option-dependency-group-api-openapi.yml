openapi: 3.2.0
info:
  title: Metaproperty Options and Operations Create metaproperty…
  version: 1.0.0
servers:
- url: https://{your-bynder-domain}/
security:
- OAuth2:
  - METAPROPERTYMANAGEMENT
  - METAMANAGEMENT
- permanentToken:
  - METAPROPERTYMANAGEMENT
  - METAMANAGEMENT
tags:
- name: Create metaproperty option dependency group
paths:
  /api/v4/metaproperties/{id}/options/{optionId}/dependencies/group:
    post:
      summary: Create dependency group
      description: Create a dependency group for a metaproperty option.
      tags:
      - Create metaproperty option dependency group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
      - name: optionId
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: string
                  description: JSON-serialised list of dependency option ids.
                  example:
                  - 00000000-0000-0000-0000000000000000
                  - 00000000-0000-0000-0000000000000000
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                example-201:
                  value:
                    message: Created
                    statuscode: 201
                    id: 00000000-0000-0000-0000000000000000
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                example-invalid-metaproperty-id:
                  value:
                    message: Invalid metaproperty ID
                    statuscode: '400'
                example-unknown-metaproperty-option-id:
                  value:
                    message: Unknown metaproperty option id
                    statuscode: '400'
                example-no-data-sent:
                  value:
                    message: No data sent
                    statuscode: '400'
                example-data-cannot-be-empty:
                  value:
                    message: Data cannot be empty
                    statuscode: '400'
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                example-unknown-dependency-option:
                  value:
                    message: Unknown dependency option
                    statuscode: '404'
      operationId: postApiV4MetapropertiesByIdOptionsByOptionIdDependenciesGroup
      x-operation-id-source: derived
components:
  securitySchemes:
    permanentToken:
      type: apiKey
      in: header
      name: Authorization
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{your-bynder-domain}/v6/authentication/oauth2/token
          scopes:
            METAPROPERTYMANAGEMENT: ''
            METAMANAGEMENT: ''
        authorizationCode:
          authorizationUrl: https://{your-auth-url}
          tokenUrl: https://{your-bynder-domain}/v6/authentication/oauth2/token
          scopes:
            METAPROPERTYMANAGEMENT: ''
            METAMANAGEMENT: ''
