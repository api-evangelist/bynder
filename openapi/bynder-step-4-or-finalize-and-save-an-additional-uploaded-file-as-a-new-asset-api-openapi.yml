tags:
- name: Step 4 OR Finalize and save an additional uploaded file as a new asset.
  description: ''
paths:
  /api/v4/media/{id}/save/additional/{uploadId}/:
    parameters: []
    post:
      tags:
      - Step 4 OR Finalize and save an additional uploaded file as a new asset.
      summary: Finalize additional file
      description: The endpoints described in Step 4 are an Either/Or choice. You should use either the `Finalise an uploaded file` endpoint to finalize and process a standard upload, or the `Finalize additional file` endpoint to finalize and save an additional uploaded file as a new asset.
      operationId: Finalize additional file
      parameters:
      - name: id
        in: path
        description: Asset id to which to save the new additional.
        required: true
        style: simple
        schema:
          type: string
          examples:
          - 00000000-0000-0000-0000-000000000000
      - name: uploadId
        in: path
        description: The upload id of the file.
        required: true
        style: simple
        schema:
          type: string
          examples:
          - 00000000-0000-0000-0000-000000000000
      requestBody:
        content:
          application/x-www-form-urlencoded:
            encoding: {}
            schema:
              type: object
              properties:
                targetId:
                  type: string
                  description: Target id as returned by the initialise call.
                  examples:
                  - final/00000000-0000-0000-0000-000000000000/Logo.png
                s3_filename:
                  type: string
                  description: Base location of the uploaded file.
                  examples:
                  - api_uploads/00000000-0000-0000-0000-000000000000/00000000-0000-0000-000000000000/Logo.png
                chunks:
                  type: number
                  description: Total number of chunks uploaded.
                  examples:
                  - 5
      responses:
        '201':
          description: Created
          headers: {}
          content:
            application/json:
              schema:
                examples:
                - mediaid: 00000000-0000-0000-0000000000000000
                  batchId: 00000000-0000-0000-0000000000000000
                  success: true
                  mediaitems:
                  - original: final/00000000-0000-0000-0000000000000000/image.jpg
                    destination: ___URL_TO_BYNDER_CDN___
                  - original: final/00000000-0000-0000-0000000000000000/thul-image.jpg
                    destination: ___URL_TO_BYNDER_CDN___
                  - original: final/00000000-0000-0000-0000000000000000/mini-image.jpg
                    destination: ___URL_TO_BYNDER_CDN___
                contentMediaType: application/json
              examples:
                success:
                  summary: Successful response
                  value:
                    mediaid: 00000000-0000-0000-0000000000000000
                    batchId: 00000000-0000-0000-0000000000000000
                    success: true
                    mediaitems: null
      deprecated: false
components:
  securitySchemes:
    permanentToken:
      type: apiKey
      name: Authorization
      in: header
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://your-bynder-domainDefaultValue/token
          scopes:
            MEDIAUPLOAD: ''
            MEDIAUPLOADFORAPPROVAL: ''
        authorizationCode:
          authorizationUrl: https://your-bynder-domainDefaultValue/
          tokenUrl: https://your-bynder-domainDefaultValue/token
          scopes:
            MEDIAUPLOAD: ''
            MEDIAUPLOADFORAPPROVAL: ''
