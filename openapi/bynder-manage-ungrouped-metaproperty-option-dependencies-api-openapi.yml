        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                example-201:
                  value:
                    message: Created
                    statuscode: 201
        '404':
          description: Not Found
          content:
            application/json:
              examples:
