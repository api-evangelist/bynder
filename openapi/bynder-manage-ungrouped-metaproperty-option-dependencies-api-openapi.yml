          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unknown metaproperty
                  statuscode:
                    type: string
                    example: '404'
              examples:
                example-unknown-metaproperty:
                  value:
                    message: Unknown metaproperty
                    statuscode: 404
