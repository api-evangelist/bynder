openapi: 3.2.0
info:
  title: Bynder Manage option dependency in dependency group API
  version: 1.0.0
  description: 'Operations tagged Manage option dependency in dependency group across 2 of this provider''s published API definitions: bynder-metaproperty-options-v4-openapi.json, bynder-options-v4-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{your-bynder-domain}/
security:
- OAuth2:
  - METAPROPERTYMANAGEMENT
  - METAMANAGEMENT
- permanentToken:
  - METAPROPERTYMANAGEMENT
  - METAMANAGEMENT
tags:
- name: Manage option dependency in dependency group
paths:
  /api/v4/metaproperties/{id}/options/{optionId}/dependencies/group/{groupId}/{dependencyId}:
    post:
      summary: Add a dependency option to a group
      description: Add a dependency option to a specific dependency group for a metaproperty option.
      tags:
      - Manage option dependency in dependency group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
      - name: optionId
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
      - name: dependencyId
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The id of the metaproperty the (metaproperty) option belongs to.
                  example: 00000000-0000-0000-0000000000000000
                optionId:
                  type: string
                  description: The id of the (metaproperty) option the dependency group belongs to.
                  example: 00000000-0000-0000-0000000000000000
                groupId:
                  type: string
                  description: The id of the dependency group you’d like to add a dependency to.
                  example: 00000000-0000-0000-0000000000000000
                dependencyId:
                  type: string
                  description: The id of the dependency (metaproperty option) you’d like to add to the dependency group.
                  example: 00000000-0000-0000-0000000000000000
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                example-201:
                  value:
                    message: Created
                    statuscode: 201
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                example-unknown-metaproperty:
                  value:
                    message: Unknown metaproperty
                    statuscode: '404'
                example-unknown-metaproperty-option:
                  value:
                    message: Unknown metaproperty option
                    statuscode: '404'
                example-unknown-group:
                  value:
                    message: Unknown group
                    statuscode: '404'
                example-unknown-dependency-option:
                  value:
                    message: Unknown dependency option
                    statuscode: '404'
    delete:
      summary: Remove a dependency option from a group
      description: Remove a dependency option from a specific dependency group for a metaproperty option.
      tags:
      - Manage option dependency in dependency group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
        description: The id of the metaproperty the (metaproperty) option belongs to.
      - name: optionId
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
        description: The id of the (metaproperty) option the dependency group belongs to.
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
        description: The id of the dependency group you’d like to remove a dependency from.
      - name: dependencyId
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
        description: The id of the dependency (metaproperty option) you’d like to remove from the dependency group.
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unknown metaproperty
                  statuscode:
                    type: string
                    example: '404'
              examples:
                example-unknown-metaproperty:
                  value:
                    message: Unknown metaproperty
                    statuscode: '404'
                example-unknown-metaproperty-option:
                  value:
                    message: Unknown metaproperty option
                    statuscode: '404'
                example-unknown-group:
                  value:
                    message: Unknown group
                    statuscode: '404'
                example-unknown-dependency-option:
                  value:
                    message: Unknown dependency option
                    statuscode: '404'
    servers:
    - url: https://{your-bynder-domain}/
components:
  securitySchemes:
    permanentToken:
      type: apiKey
      in: header
      name: Authorization
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{your-bynder-domain}/v6/authentication/oauth2/token
          scopes:
            METAPROPERTYMANAGEMENT: ''
            METAMANAGEMENT: ''
        authorizationCode:
          authorizationUrl: https://{your-auth-url}
          tokenUrl: https://{your-bynder-domain}/v6/authentication/oauth2/token
          scopes:
            METAPROPERTYMANAGEMENT: ''
            METAMANAGEMENT: ''
x-refined-from:
- bynder-metaproperty-options-v4-openapi.json
- bynder-options-v4-openapi.json
