openapi: 3.2.0
info:
  title: Assets Upload API
  version: 1.0.0
servers:
- url: https://{your-bynder-domain}/
tags:
- name: Upload
paths:
  /api/upload/endpoint:
    get:
      summary: Get closest AmazonS3 upload endpoint
      description: Get the closest AmazonS3 upload endpoint.
      security:
      - OAuth2:
        - MEDIAUPLOAD
        - MEDIAUPLOADFORAPPROVAL
      - permanentToken:
        - MEDIAUPLOAD
        - MEDIAUPLOADFORAPPROVAL
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: string
                example: https://bynder-public-eu-central-1.s3.amazonaws.com/
      tags:
      - Upload
  /api/upload/init:
    post:
      summary: Initialise upload
      description: Initialise an upload.
      security:
      - OAuth2:
        - MEDIAUPLOAD
        - MEDIAUPLOADFORAPPROVAL
      - permanentToken:
        - MEDIAUPLOAD
        - MEDIAUPLOADFORAPPROVAL
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  example: image.jpeg
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  s3file:
                    type: object
                    properties:
                      uploadid:
                        type: string
                        example: UPLOAD_ID
                      targetid:
                        type: string
                        example: final/00000000-0000-0000-0000-000000000000/image.jpeg
                  s3_filename:
                    type: string
                    example: pluploads/api/00000000-0000-0000-0000-000000000000/image.jpeg
                  target_key:
                    type: string
                    example: pluploads/api/00000000-0000-0000-0000-000000000000/image.jpeg
                  multipart_params:
                    type: object
                    properties:
                      acl:
                        type: string
                        example: private
                      success_action_status:
                        type: string
                        example: '201'
                      Content-Type:
                        type: string
                        example: image/*
                      key:
                        type: string
                        example: pluploads/api/00000000-0000-0000-0000-000000000000/image.jpeg
                      Policy:
                        type: string
                        example: AWS_S3_POLICY
                      X-Amz-Signature:
                        type: string
                        example: AWS_S3_SIGNATURE
                      x-amz-credential:
                        type: string
                        example: AWS_S3_AUTH
                      x-amz-algorithm:
                        type: string
                        example: AWS4-HMAC-SHA256
                      x-amz-date:
                        type: string
                        example: 20160216T100755Z
        '400':
          description: Invalid input
          content:
            text/plain:
              schema:
                type: string
                example:
                  filename: '''image'' is not a valid filename'
      tags:
      - Upload
  /api/v4/upload/{id}:
    post:
      summary: Register uploaded chunk
      description: Register the completion of an uploaded chunk.
      security:
      - OAuth2:
        - MEDIAUPLOAD
        - MEDIAUPLOADFORAPPROVAL
      - permanentToken:
        - MEDIAUPLOAD
        - MEDIAUPLOADFORAPPROVAL
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: T3.fS5.5HPhtYFtm2b_.e7wVe910tL5XQutKw1jkMqlP5cPQVyZkOZxZ9lJiGUk4FIw6M0CFZ3xogTWrm.GPI2p2CaglQcAS5aH37zT_vHJnbtkebYbheXIQc_.M_6hM
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                chunkNumber:
                  type: number
                  description: required for every chunk
                  example: 5
                targetid:
                  type: string
                  description: required for every chunk
                  example: final/00000000-0000-0000-0000000000000000/Logo.png
                filename:
                  type: string
                  description: required for every chunk
                  example: api_uploads/00000000-0000-0000-0000000000000000/00000000-0000-0000-0000000000000000/Logo.png/p5
                s3_filename:
                  type: string
                  description: required in the final call
                  example: api_uploads/159D8D4B-B981-49B8-BF0569FD144CB359/A29FABF0-26B8-44BF-890920E4C09E7C11/Logo.png
                chunks:
                  type: number
                  description: required in the final call
                  example: 5
                original_filename:
                  type: string
                  description: required in the final call
                  example: Logo.png
      responses:
        '202':
          description: Chunk registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Only for chunk registration
                    example: ok
                  output:
                    type: string
                    example: final/2ba07d00-586a-4a44-b13c-c58598cfe828/
                  batchId:
                    type: string
                    example: 00000000-0000-0000-0000000000000000
                  file:
                    type: object
                    properties:
                      bucket:
                        type: string
                        example: BUCKET
                      path:
                        type: string
                        example: final/2ba07d00-586a-4a44-b13c-c58598cfe828/IMG_1874.JPG
                      type:
                        type: string
                        example: s3
                  filename:
                    type: string
                    example: final/2ba07d00-586a-4a44-b13c-c58598cfe828/IMG_1874.JPG
                  importId:
                    type: string
                    example: 000000000-0000-0000-0000000000000000
                  locationType:
                    type: string
                    example: s3
                  success:
                    type: integer
                    example: 1
        '500':
          description: Upload failed or not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Could not complete upload
                  retry:
                    type: integer
                    example: 1
                  success:
                    type: boolean
                    example: false
      tags:
      - Upload
  /api/v4/upload/poll:
    get:
      summary: Retrieve poll state
      description: 'This call needs to be executed in a loop until its response returns the item(s) id(s) passed in the **items** parameter.

        '
      security:
      - OAuth2:
        - MEDIAUPLOAD
        - MEDIAUPLOADFORAPPROVAL
      - permanentToken:
        - MEDIAUPLOAD
        - MEDIAUPLOADFORAPPROVAL
      parameters:
      - in: query
        name: items
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
        description: Comma-separated import id's of a finalised file, as returned by the finalise call.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              examples:
                success:
                  summary: Successful response
                  value:
                    itemsDone:
                    - 00000000-0000-0000-0000000000000000
                    itemsFailed: []
                    itemsRejected: []
      tags:
      - Upload
components:
  securitySchemes:
    permanentToken:
      type: apiKey
      in: header
      name: Authorization
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{your-bynder-domain}/v6/authentication/oauth2/token
          scopes:
            MEDIAUPLOAD: ''
            MEDIAUPLOADFORAPPROVAL: ''
        authorizationCode:
          authorizationUrl: https://{your-auth-url}
          tokenUrl: https://{your-bynder-domain}/v6/authentication/oauth2/token
          scopes:
            MEDIAUPLOAD: ''
            MEDIAUPLOADFORAPPROVAL: ''
