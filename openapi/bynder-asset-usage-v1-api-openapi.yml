  /v7/analytics/api/v1/asset/{assetId}:
    get:
      summary: Retrieve all events performed in a given asset
      description: This endpoint will allow you to retrieve all the events performed in a given asset.
      tags:
      - Asset Usage V1
      parameters:
      - name: assetId
        in: path
        description: Asset id.
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
      - name: limit
        in: query
        description: The maximum number of analytics events to retrieve. Allowed values are between 1 and 10000.
        required: false
        schema:
          type: integer
          default: 1000
          example: 100
      - name: cursor
        in: query
        description: Cursor mark returned in the response headers to be used for pagination purposes.
        required: false
        schema:
          type: string
          default: MA
          example: MTAwMA
      - name: fromDateTime
        in: query
        description: Retrieve events performed in a given asset occurred after this date. ISO8601 format yyyy-mm-ddThh:mm[:ssZ] with optional seconds.
        required: false
        schema:
          type: string
          format: date-time
          example: 2022-01-01T01:00
      - name: toDateTime
        in: query
        description: Set a date range together with the "fromDateTime" parameter.
        required: false
        schema:
          type: string
          format: date-time
          example: 2022-06-01T01:00
      responses:
        '200':
          description: Successful response
          headers:
            Next-Cursor:
              description: The next cursor value to send if you want to continue with your paginated request.
