  /v7/analytics/api/v1/asset/v2/download:
    get:
      summary: Retrieve asset download events
      tags:
      - Asset Usage V1
      description: This endpoint only offers data from 2023-11-01. Use the Asset Download endpoint for previous data.
      parameters:
      - name: limit
        in: query
        description: The maximum number of analytics events to retrieve. Allowed values are between 1 and 10000.
        required: false
        schema:
          type: integer
          default: 1000
          example: 100
      - name: cursor
        in: query
        description: Cursor mark returned in the response headers to be used for pagination purposes.
        required: false
        schema:
          type: string
          default: MA
          example: MTAwMA
      - name: fromDateTime
        in: query
        description: 'Retrieve download events occurred after this date. ISO8601 format yyyy-mm-ddThh:mm[:ssZ] with optional seconds.

          '
        required: false
        schema:
          type: string
          format: date-time
          example: 2022-01-01T01:00
      - name: toDateTime
        in: query
        description: 'Set a date range together with the "fromDateTime" parameter. ISO8601 format yyyy-mm-ddThh:mm[:ssZ] with optional seconds.

          '
        required: false
        schema:
          type: string
          format: date-time
          example: 2022-06-01T01:00
      responses:
        '200':
          description: Successful response
          headers:
            Next-Cursor:
              description: The next cursor value to send if you want to continue with your paginated request.
              schema:
                type: string
                example: MTAwMA
            Next-Url:
              description: The next url path to query if you want to continue with your paginated request.
              schema:
                type: string
                example: /api/v1/asset/v2/download?limit=1000&cursor=MTAwMA
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    eventId:
                      type: string
                      description: Id of the event
                      example: 1408aec2-3114-43dd-be20-ffb1246a5231
                    eventType:
                      type: string
                      description: Type of event
                      example: AssetDownloadRequested
                    dateTime:
                      type: string
                      format: date-time
                      description: Date and time when the event occurred
                      example: '2021-11-15T10:07:57.781Z'
                    userId:
                      type: string
                      description: Id of the user that generated the event
                      example: 1A84D758-2B3A-141F-8F07D71AA1F223BD
                    assetId:
                      type: string
                      description: Id of the asset
                      example: CA510292-E39E-4B28-AB6444CDD2B1C5C0
                    downloadReasons:
                      type: array
                      items:
                        type: string
                      description: Reasons given on why the asset was downloaded
                      example:
                      - reason1
                      - reason2
              examples:
                example-1:
                  summary: Example response
                  value: "[\n  {\n    \"eventId\": \"1408aec2-3114-43dd-be20-ffb1246a5231\",\n    \"eventType\": \"AssetDownloadRequested\",\n    \"dateTime\": \"2021-11-15T10:07:57.781+00:00\",\n    \"userId\": \"1A84D758-2B3A-141F-8F07D71AA1F223BD\",\n    \"assetId\": \"CA510292-E39E-4B28-AB6444CDD2B1C5C0\",\n    \"downloadReasons\": [\n      \"reason1\",\n      \"reason2\"\n    ]\n  },\n  {\n    \"eventId\": \"5908aec2-3114-43dd-be20-ffb1246a5231\",\n    \"eventType\": \"AssetDownloadRequested\",\n    \"dateTime\": \"2021-11-15T10:07:57.781+00:00\",\n    \"userId\": \"1A84D758-2B3A-141F-8F07D71AA1F223BD\",\n    \"assetId\": \"C58ED8C6-6B09-4CD6-B71C32C6715834F\",\n    \"downloadReasons\": [\n      \"reason2\"\n    ]\n  }\n]\n"
