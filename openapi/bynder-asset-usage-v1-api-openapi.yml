openapi: 3.2.0
info:
  title: Analytics Asset Usage V1 API
  version: 1.0.0
  description: 'These endpoints return information related to the specific event. You can enrich these events with specific data about the asset or the user by making use of the [Analytics Reporting tool](#reference/analytics/reporting) or the [Users API endpoints](#reference/users).

    '
servers:
- url: https://{your-bynder-domain}
security:
- permanentToken:
  - analytics.api:read
- oauth2:
  - analytics.api:read
tags:
- name: Asset Usage V1
  description: 'These endpoints return information related to the specific event. You can enrich these events with specific data about the asset or the user by making use of the [Analytics Reporting tool](#reference/analytics/reporting) or the [Users API endpoints](#reference/users).

    '
paths:
  /v7/analytics/api/v1/asset/view:
    get:
      summary: Retrieve asset view events
      tags:
      - Asset Usage V1
      description: This endpoint will be deprecated on July, 15th. Use the Asset Views V2 endpoint instead.
      parameters:
      - name: limit
        in: query
        description: The maximum number of analytics events to retrieve. Allowed values are between 1 and 10000.
        required: false
        schema:
          type: integer
          default: 1000
      - name: cursor
        in: query
        description: Cursor mark returned in the response headers to be used for pagination purposes.
        required: false
        schema:
          type: string
          default: MA
      - name: fromDateTime
        in: query
        description: 'Retrieve view events occurred after this date. ISO8601 format yyyy-mm-ddThh:mm[:ssZ] with optional seconds.

          '
        required: false
        schema:
          type: string
          format: date-time
      - name: toDateTime
        in: query
        description: 'Set a date range together with the "fromDateTime" parameter. ISO8601 format yyyy-mm-ddThh:mm[:ssZ] with optional seconds.

          '
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Successful response
          headers:
            Next-Cursor:
              description: The next cursor value to send if you want to continue with your paginated request.
              schema:
                type: string
            Next-Url:
              description: The next url path to query if you want to continue with your paginated request.
              schema:
                type: string
          content:
            application/json:
              examples:
                example-1:
                  summary: Example response
                  value:
                  - id: 62de6d714e29485a81824fe3
                    eventType: asset.view
                    userId: 1A84D758-2B3A-141F-8F07D71AA1F223BD
                    dateTime: '2021-11-15T10:07:57.781+00:00'
                    assetId: CA510292-E39E-4B28-AB6444CDD2B1C5C0
                    assetType: image
                    assetName: Product Insights
                    assetAudit: ACCEPTED
                    fileName: CA510292-E39E-4B28-AB6444CDD2B1C5C___Product Insights
                  - id: 62de6d714e29485a81824fe4
                    eventType: asset.view
                    userId: 1A84D758-2B3A-141F-8F07D71AA1F223BD
                    dateTime: '2021-11-15T10:08:18.752+00:00'
                    assetId: C58ED8C6-6B09-4CD6-B71C32C6715834F1
                    assetType: image
                    assetName: Reporting Schedule Nov 2022
                    assetAudit: ACCEPTED
                    fileName: C58ED8C6-6B09-4CD6-B71C32C6715834F1___Reporting Schedule Nov 2022
            text/csv:
              examples:
                example-1:
                  summary: Example CSV response
                  value: 'id,eventType,userId,dateTime,assetId,assetType,assetName,assetAudit,fileName

                    62de6d714e29485a81824fe3,asset.view,1A84D758-2B3A-141F-8F07D71AA1F223BD,1655823377864,CA510292-E39E-4B28-AB6444CDD2B1C5C0,image,Product Insights,ACCEPTED,CA510292-E39E-4B28-AB6444CDD2B1C5C___Product Insights

                    62de6d714e29485a81824fe4,asset.view,1A84D758-2B3A-141F-8F07D71AA1F223BD,1655996103781,C58ED8C6-6B09-4CD6-B71C32C6715834F1,image,Reporting Schedule Nov 2022,ACCEPTED,C58ED8C6-6B09-4CD6-B71C32C6715834F1___Reporting Schedule Nov 2022

