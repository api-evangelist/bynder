                      metapropertyID: 00000000-0000-0000-0000-000000000000
                      created_by:
                        ID: 00000000-0000-0000-0000-000000000000
                        fullName: User1
                    - ID: 00000000-0000-0000-0000-000000000000
                      position: 2
                      default: false
                      label: Sightseeing
                      dateCreated: '2017-10-27T16:32:16+00:00'
