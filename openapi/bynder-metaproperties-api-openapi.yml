openapi: 3.2.0
info:
  title: Bynder Metaproperties API
  version: 1.0.0
  description: 'Operations tagged Metaproperties across 2 of this provider''s published API definitions: bynder-product-layer-v4-openapi.json, bynder-wf-metaproperties-v4-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{your-bynder-domain}/
- url: https://{your-bynder-domain}
tags:
- name: Metaproperties
  description: ''
paths:
  /api/pim/metaproperties:
    get:
      summary: Retrieve metaproperties
      description: Retrieve a list of metaproperties.
      tags:
      - Metaproperties
      security:
      - OAuth2:
        - metaproperty.view
      - permanentToken:
        - metaproperty.view
      responses:
        '200':
          description: Successfully retrieved metaproperties
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
    servers:
    - url: https://{your-bynder-domain}/
  /api/pim/metaproperties/{id}:
    get:
      summary: Retrieve specific metaproperty
      description: Retrieve the details of a specific metaproperty.
      tags:
      - Metaproperties
      security:
      - OAuth2:
        - METAPROPERTYMANAGEMENT
      - permanentToken:
        - METAPROPERTYMANAGEMENT
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000-0000000000000000
      responses:
        '200':
          description: Successfully retrieved specific metaproperty
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 00000000-0000-0000-0000-000000000000
                  name:
                    type: string
                    example: Product A
                  label:
                    type: string
                    example: Product A
                  description:
                    type: string
                    example: Metaproperty for Product A
                  mp_options:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 00000000-0000-0000-0000-000000000000
                        name:
                          type: string
                          example: Product A option 1
                        label:
                          type: string
                          example: Product A option 1
                        description:
                          type: string
                          example: Metaproperty option 1 for Product A
                        metapropertyid:
                          type: string
                          example: 00000000-0000-0000-0000-000000000000
                        relations:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: 00000000-0000-0000-0000-000000000000
                              name:
                                type: string
                                example: Product B option 1
                              label:
                                type: string
                                example: Product B option 1
                              description:
                                type: string
                                example: Metaproperty option 1 for Product B
                              metapropertyid:
                                type: string
                                example: 00000000-0000-0000-0000-000000000000
    servers:
    - url: https://{your-bynder-domain}/
  /api/workflow/metaproperties:
    get:
      summary: Retrieve metaproperties
      tags:
      - Metaproperties
      security:
      - permanentToken:
        - METAPROPERTYOVERVIEW
      - OAuth2:
        - METAPROPERTYOVERVIEW
      responses:
        '200':
          description: List of metaproperties
          content:
            application/json:
              schema:
                type: object
                properties:
                  ID:
                    type: string
                    example: 00000000-0000-0000-0000-000000000000
                  label:
                    type: string
                    example: Holiday Type
                  short_name:
                    type: string
                    example: JOB-9
                  description:
                    type: string
                    example: ''
                  export:
                    type: string
                    example: 'false'
                  removed_by:
                    type: string
                    example: null
                  dependency:
                    type: string
                    example: null
                  position:
                    type: number
                    example: 12
                  default:
                    type: boolean
                    example: true
                  dateCreated:
                    type: string
                    example: '2017-10-27T16:31:52+00:00'
                  exportName:
                    type: string
                    example: ''
                  type:
                    type: string
                    example: select
                  required:
                    type: boolean
                    example: false
                  dependencyValue:
                    type: string
                    example: null
                  assetbank_metaproperty:
                    type: string
                    example: null
                  entity:
                    type: string
                    enum:
                    - job
                    - campaign
                    example: job
                  created_by:
                    type: object
                    properties:
                      ID:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                      fullName:
                        type: string
                        example: User1
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        ID:
                          type: string
                          example: 00000000-0000-0000-0000-000000000000
                        position:
                          type: number
                          example: 1
                        default:
                          type: boolean
                          example: true
                        label:
                          type: string
                          example: Beach
                        dateCreated:
                          type: string
                          example: '2017-10-27T16:31:52+00:00'
                        metapropertyID:
                          type: string
                          example: 00000000-0000-0000-0000-000000000000
                        created_by:
                          type: object
                          properties:
                            ID:
                              type: string
                              example: 00000000-0000-0000-0000-000000000000
                            fullName:
                              type: string
                              example: User1
              examples:
                example-1:
                  value:
                    ID: 00000000-0000-0000-0000-000000000000
                    label: Holiday Type
