openapi: 3.2.0
info:
  title: Metaproperty Options and Operations Retrieve all…
  version: 1.0.0
servers:
- url: https://{your-bynder-domain}/
security:
- OAuth2:
  - METAPROPERTYMANAGEMENT
  - METAMANAGEMENT
- permanentToken:
  - METAPROPERTYMANAGEMENT
  - METAMANAGEMENT
tags:
- name: Retrieve all metaproperty option dependencies globally
paths:
  /api/v4/metaproperties/options/dependencies:
    get:
      summary: Retrieve global option dependencies
      description: Retrieve all metaproperty option dependencies globally.
      tags:
      - Retrieve all metaproperty option dependencies globally
      responses:
        '200':
          description: A list of global option dependencies.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                        example: 00000000-0000-0000-0000000000000000
              examples:
                example1:
                  value:
                    00000000-0000-0000-0000000000000000:
                      00000000-0000-0000-0000000000000000:
                        00000000-0000-0000-0000000000000000:
                        - 00000000-0000-0000-0000000000000000
                        - 00000000-0000-0000-0000000000000001
                        - 00000000-0000-0000-0000000000000002
                    00000000-0000-0000-0000000000000001:
                      00000000-0000-0000-0000000000000000:
                        ungrouped:
                        - 00000000-0000-0000-0000000000000000
                        - 00000000-0000-0000-0000000000000001
      operationId: getApiV4MetapropertiesOptionsDependencies
      x-operation-id-source: derived
components:
  securitySchemes:
    permanentToken:
      type: apiKey
      in: header
      name: Authorization
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{your-bynder-domain}/v6/authentication/oauth2/token
          scopes:
            METAPROPERTYMANAGEMENT: ''
            METAMANAGEMENT: ''
        authorizationCode:
          authorizationUrl: https://{your-auth-url}
