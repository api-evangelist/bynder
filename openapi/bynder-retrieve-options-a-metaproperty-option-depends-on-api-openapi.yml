openapi: 3.2.0
info:
  title: Metaproperty Options and Operations Retrieve options a…
  version: 1.0.0
servers:
- url: https://{your-bynder-domain}/
security:
- OAuth2:
  - METAPROPERTYMANAGEMENT
  - METAMANAGEMENT
- permanentToken:
  - METAPROPERTYMANAGEMENT
  - METAMANAGEMENT
tags:
- name: Retrieve options a metaproperty option depends on
paths:
  /api/v4/metaproperties/{id}/options/{optionId}/dependencies:
    get:
      summary: Retrieve specific metaproperty option dependencies
      description: Retrieve options a metaproperty option depends on.
      tags:
      - Retrieve options a metaproperty option depends on
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
      - name: optionId
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000000000000000
      - name: includeGroupedResults
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A list of specific metaproperty option dependencies.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                    example: 00000000-0000-0000-0000000000000000
                - type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                      example: 00000000-0000-0000-0000000000000000
              examples:
                example1:
                  value:
                  - 00000000-0000-0000-0000000000000000
                  - 00000000-0000-0000-0000000000000001
                example2:
                  value:
                    00000000-0000-0000-0000000000000000:
                    - 00000000-0000-0000-0000000000000000
                    - 00000000-0000-0000-0000000000000001
                    - 00000000-0000-0000-0000000000000002
                    ungrouped:
                    - 00000000-0000-0000-0000000000000000
        '404':
          description: Unknown metaproperty or metaproperty option
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unknown metaproperty
                  statuscode:
                    type: string
                    example: '404'
      operationId: getApiV4MetapropertiesByIdOptionsByOptionIdDependencies
      x-operation-id-source: derived
components:
  securitySchemes:
    permanentToken:
      type: apiKey
      in: header
      name: Authorization
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{your-bynder-domain}/v6/authentication/oauth2/token
          scopes:
            METAPROPERTYMANAGEMENT: ''
            METAMANAGEMENT: ''
        authorizationCode:
          authorizationUrl: https://{your-auth-url}
          tokenUrl: https://{your-bynder-domain}/v6/authentication/oauth2/token
          scopes:
            METAPROPERTYMANAGEMENT: ''
            METAMANAGEMENT: ''
