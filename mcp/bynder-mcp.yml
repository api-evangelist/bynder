  source_operation: openapi/bynder-asset-v4-openapi.json#GET /api/v4/media/
  scope: asset:read
- name: get_asset
  description: Retrieve a single asset with its metaproperty values and derivatives.
  source_operation: openapi/bynder-asset-v4-openapi.json#GET /api/v4/media/{id}
  scope: asset:read
- name: update_asset
  description: Modify an asset's metadata, tags, thumbnail or metaproperty values.
  source_operation: openapi/bynder-asset-v4-openapi.json#POST /api/v4/media/{id}
  scope: asset:write
- name: search_similar_assets
  description: Find assets visually or semantically similar to a given asset.
  source_operation: openapi/bynder-similar-assets-openapi.json#POST /api/1/assets/similarity-search/
