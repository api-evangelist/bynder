deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: searched
pointer_policy: >-
  No `MCPServer` pointer is emitted in apis.yml for this artifact. The rating's
  MCPServer checks assert that the PROVIDER ships an MCP server; Bynder does not.
  This file is a candidate surface derived by API Evangelist and must not be
  scored as a Bynder agent surface. If Bynder publishes a real server, add the
  pointer then.
deployment_note: >-
  Bynder ships no MCP server of any kind — no hosted endpoint and no installable
  stdio package. The tools below are a CANDIDATE surface derived by API Evangelist
  from Bynder's own published OpenAPI, not something Bynder operates. Third-party
  bridges exist (Zapier exposes Content Workflow by Bynder; CI HUB sells a
  commercial DAM connector) but neither is first-party and neither covers the core
  DAM REST API, so neither is recorded as a Bynder MCP server.
  `auth: oauth` records what a server would have to implement — Bynder's OAuth 2.0
  authorization-code and client-credentials flows against the customer portal
  domain — not an auth mode of a server that exists.
candidate_note: >-
  Any Bynder MCP server has to be per-tenant: the base URL is the customer's own
  portal domain (https://{your-bynder-domain}), so a single shared hosted server
  is not possible without per-customer configuration. That is the structural reason
  a hosted Bynder MCP endpoint does not exist, and it is worth stating rather than
  reading the absence as neglect.
tools:
- name: list_assets
